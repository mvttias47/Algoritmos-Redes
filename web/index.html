<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Infra Providencia — DEBUG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23007acc'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>
  <style>
    html,body,#map{height:100%;margin:0}
    .panel{
      position:absolute;z-index:1000;top:10px;left:10px;
      background:#fff;padding:10px 12px;border-radius:6px;
      box-shadow:0 2px 8px rgba(0,0,0,.15);
      font:14px system-ui,Segoe UI,Roboto,Arial;min-width:260px
    }
    .row{margin:.35rem 0}
    .err{color:#b00020;font-weight:600}
    .ok{color:#0a7d33}
    code{background:#f3f3f3;padding:2px 4px;border-radius:4px}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <div class="row"><label><input id="chk-infra" type="checkbox" checked> Infraestructura</label></div>
    <div class="row"><label><input id="chk-beb"   type="checkbox" checked> Bebederos</label></div>
    <div class="row"><label><input id="chk-uv" type="checkbox" checked> UV (grilla)</label></div>
    <div class="row"><label><input id="chk-temp" type="checkbox" checked> Temperatura (grilla)</label></div>
    <div class="row"><label><input id="chk-sombra" type="checkbox" checked> Sombra (12:00)</label></div>

    <!-- Ruta base con pgr_dijkstra (lógica original) -->
    <div class="row">
      <label><input id="chk-route" type="checkbox"> Ruta (pgr_dijkstra)</label>
      <button id="btn-route-reset" type="button" style="margin-left:.5rem">Reset</button>
    </div>

    <!-- Ruta alternativa construida a partir de amenazas (punto 8) -->
    <div class="row">
      <label><input id="chk-route-alt" type="checkbox"> Ruta alternativa (ejemplo de caso)</label>
    </div>

    <div class="row" id="route-info" style="font-size:12px;color:#333"></div>

    <!-- Simulación de amenazas (puntos 6 y 7) -->
    <div class="row">
      <label><input id="chk-amenazas-sim" type="checkbox"> Amenazas posibles (simulación)</label>
    </div>
    <div class="row">
      Umbral falla (%):
      <input id="umbral-falla" type="number" min="0" max="100" value="50" style="width:60px">
      <button id="btn-simular-amenazas" type="button" style="margin-left:.5rem">Simular</button>
    </div>
    <div class="row" id="amenazas-info" style="font-size:12px;color:#333"></div>

    <!-- NUEVO: archivo con prob. de fallo por enlace/nodo (punto 4) -->
    <div class="row">
      <button id="btn-export-prob" type="button">Descargar prob. enlaces/nodos</button>
    </div>

    <hr>
    <div class="row"><b>Infra:</b> <span id="infra-count">—</span></div>
    <div class="row"><b>Bebederos:</b> <span id="beb-count">—</span></div>
    <div class="row err" id="errors"></div>
    <div class="row">Ruta esperada de archivos: <code>/json/*.geojson</code></div>
    <div class="row">URL actual: <code id="url"></code></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MAPA BASE + INFRA/BEBEDEROS -->
  <script>
    document.getElementById('url').textContent = window.location.pathname;

    const map = L.map('map').setView([-33.431,-70.618], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,attribution:'© OSM'
    }).addTo(map);

    const infraLayer = L.layerGroup();
    const bebLayer   = L.layerGroup();

    // NUEVO: guardamos todos los enlaces de infraestructura para el punto 4
    let infraData = null;

    const infraCountEl = document.getElementById('infra-count');
    const bebCountEl   = document.getElementById('beb-count');
    const errorsEl     = document.getElementById('errors');

    function logErr(msg){
      console.error(msg);
      const div=document.createElement('div');
      div.textContent=msg;
      errorsEl.appendChild(div);
    }

    async function safeFetch(url){
      const u = url + (url.includes('?')?'&':'?') + 'v=' + Date.now();
      const r = await fetch(u);
      if(!r.ok){ throw new Error(`GET ${url} -> ${r.status}`); }
      return r.json();
    }

    async function loadInfra(){
      infraLayer.clearLayers();
      let total=0;
      const urls=[
        '/json/infra_provi_sector.geojson',
        '/json/infra_provi_sector_south.geojson',
        '/json/infra_provi_sector_south_exp.geojson',
        '/json/infra_provi_sector_east.geojson'
      ];
      const added=[];
      infraData = { type: 'FeatureCollection', features: [] }; // reiniciamos cache

      for(const url of urls){
        try{
          const g = await safeFetch(url);
          if(!g?.features?.length) continue;
          total += g.features.length;
          added.push(L.geoJSON(g,{style:()=>({weight:2})}));
          infraData.features = infraData.features.concat(g.features);
        }catch(e){ logErr(e.message); }
      }
      added.forEach(l=>infraLayer.addLayer(l));
      infraCountEl.textContent = total ? `${total} features` : '0';
      if(document.getElementById('chk-infra').checked && infraLayer.getLayers().length){
        infraLayer.addTo(map);
        try{ map.fitBounds(infraLayer.getBounds(),{padding:[20,20]}); }catch(_){}
      }else{
        map.removeLayer(infraLayer);
      }
    }

    async function loadBeb(){
      bebLayer.clearLayers();
      try{
        const g = await safeFetch('/json/metadata_bebederos.geojson');
        const n = (g?.features||[]).length;
        bebCountEl.textContent = n ? `${n} puntos` : '0';
        if(n){
          const pts=L.geoJSON(g,{
            pointToLayer:(f,latlng)=>L.circleMarker(latlng,{radius:5}),
            onEachFeature:(f,l)=>l.bindTooltip((f.properties?.fuente||'bebedero'))
          });
          bebLayer.addLayer(pts);
          if(document.getElementById('chk-beb').checked) bebLayer.addTo(map);
        }else{
          map.removeLayer(bebLayer);
        }
      }catch(e){
        logErr(e.message);
        bebCountEl.textContent='error';
        map.removeLayer(bebLayer);
      }
    }

    document.getElementById('chk-infra').addEventListener('change',e=>{
      e.target.checked ? infraLayer.addTo(map) : map.removeLayer(infraLayer);
    });
    document.getElementById('chk-beb').addEventListener('change',e=>{
      e.target.checked ? bebLayer.addTo(map) : map.removeLayer(bebLayer);
    });
  </script>

  <!-- TEMPERATURA -->
  <script>
    // guardamos los datos en memoria para la simulación
    let tempData = null;

    function tempColor(t){
      if (t==null) return '#bbbbbb';
      if (t < 5)  return '#313695';
      if (t < 10) return '#4575b4';
      if (t < 15) return '#74add1';
      if (t < 20) return '#abd9e9';
      if (t < 25) return '#fdae61';
      if (t < 30) return '#f46d43';
      if (t < 35) return '#d73027';
      return '#a50026';
    }
    const tempLayer = L.layerGroup();
    const legend = L.control({position:'bottomright'});
    legend.onAdd = function(){
      const div = L.DomUtil.create('div','info legend');
      div.style.background='#fff'; div.style.padding='6px 8px'; div.style.borderRadius='6px';
      const grades=[5,10,15,20,25,30,35];
      let html='<b>Temp (°C)</b><br>';
      for(let i=0;i<grades.length+1;i++){
        const t = (i===0?grades[0]-1:grades[i-1]+0.01);
        html += `<i style="background:${tempColor(t)};width:12px;height:12px;display:inline-block;margin-right:4px"></i>` +
                `${i===0?'<'+grades[0]: (i===grades.length?grades[i-1]+'+':grades[i-1]+'–'+grades[i])}<br>`;
      }
      div.innerHTML=html; return div;
    };
    async function loadTemp(){
      tempLayer.clearLayers();
      try{
        const r = await fetch('/json/amenaza_temp_grid.geojson?v='+Date.now());
        if(!r.ok) throw new Error('GET amenaza_temp_grid.geojson '+r.status);
        const g = await r.json();
        tempData = g;   // guardamos para la simulación
        const grid = L.geoJSON(g, {
          style: f => ({ color:'#666', weight:0.5, fillOpacity:0.6, fillColor: tempColor(f.properties?.temp_c) }),
          onEachFeature: (f,l) => l.bindTooltip(`T: ${f.properties?.temp_c ?? 'n/a'} °C`)
        });
        tempLayer.addLayer(grid);
        if (document.getElementById('chk-temp').checked) tempLayer.addTo(map); else map.removeLayer(tempLayer);
        if (document.getElementById('chk-temp').checked){ legend.addTo(map); } else { legend.remove(); }
      }catch(e){ console.error(e); map.removeLayer(tempLayer); legend.remove?.(); }
    }
    document.getElementById('chk-temp').addEventListener('change', e=>{
      if (e.target.checked){ tempLayer.addTo(map); legend.addTo(map); }
      else { map.removeLayer(tempLayer); legend.remove?.(); }
    });
  </script>

  <!-- UV -->
  <script>
    // guardamos también los datos de UV
    let uvData = null;

    function uvColor(u){
      if (u==null) return '#bbbbbb';
      if (u < 3)  return '#2dc937';
      if (u < 6)  return '#e7b416';
      if (u < 8)  return '#ff7f00';
      if (u < 11) return '#cc3232';
      return '#7f00ff';
    }
    const uvLayer = L.layerGroup();
    const legendUV = L.control({position:'bottomleft'});
    legendUV.onAdd = function(){
      const div = L.DomUtil.create('div','info legend');
      div.style.background='#fff'; div.style.padding='6px 8px'; div.style.borderRadius='6px';
      div.innerHTML = '<b>UV</b><br>'
        + `<i style="background:${uvColor(2.9)};display:inline-block;width:12px;height:12px;margin-right:4px"></i>0–2 (Bajo)<br>`
        + `<i style="background:${uvColor(5.0)};display:inline-block;width:12px;height:12px;margin-right:4px"></i>3–5 (Moderado)<br>`
        + `<i style="background:${uvColor(7.0)};display:inline-block;width:12px;height:12px;margin-right:4px"></i>6–7 (Alto)<br>`
        + `<i style="background:${uvColor(9.0)};display:inline-block;width:12px;height:12px;margin-right:4px"></i>8–10 (Muy alto)<br>`
        + `<i style="background:${uvColor(11.5)};display:inline-block;width:12px;height:12px;margin-right:4px"></i>11+ (Extremo)`;
      return div;
    };
    async function loadUV(){
      uvLayer.clearLayers();
      try{
        const r = await fetch('/json/amenaza_uv_grid.geojson?v='+Date.now());
        if(!r.ok) throw new Error('GET amenaza_uv_grid.geojson '+r.status);
        const g = await r.json();
        uvData = g;   // guardamos para la simulación
        const grid = L.geoJSON(g, {
          style: f => ({ color:'#666', weight:0.5, fillOpacity:0.55, fillColor: uvColor(f.properties?.uv_index) }),
          onEachFeature: (f,l) => l.bindTooltip(`UV: ${f.properties?.uv_index ?? 'n/a'}`)
        });
        uvLayer.addLayer(grid);
        if (document.getElementById('chk-uv').checked) { uvLayer.addTo(map); legendUV.addTo(map); }
        else { map.removeLayer(uvLayer); legendUV.remove?.(); }
      }catch(e){ console.error(e); map.removeLayer(uvLayer); legendUV.remove?.(); }
    }
    document.getElementById('chk-uv').addEventListener('change', e=>{
      if (e.target.checked){ uvLayer.addTo(map); legendUV.addTo(map); }
      else { map.removeLayer(uvLayer); legendUV.remove?.(); }
    });
  </script>

  <!-- SOMBRA -->
  <script>
    const sombraPolysLayer = L.layerGroup();
    const sombraRoadsLayer = L.layerGroup();
    async function loadSombraStatic(){
      sombraPolysLayer.clearLayers();
      sombraRoadsLayer.clearLayers();
      try{
        const sp = await fetch('/json/sombra_poligonos.geojson?v='+Date.now()).then(r=>r.json());
        const sr = await fetch('/json/infra_sombreada.geojson?v='+Date.now()).then(r=>r.json());
        const polys = L.geoJSON(sp,{style:{color:'#000',weight:0,fillOpacity:0.25,fillColor:'#000'}});
        const roads = L.geoJSON(sr,{style:{color:'#222',weight:3}});
        sombraPolysLayer.addLayer(polys);
        sombraRoadsLayer.addLayer(roads);
        if (document.getElementById('chk-sombra').checked){
          sombraPolysLayer.addTo(map); sombraRoadsLayer.addTo(map);
        } else {
          map.removeLayer(sombraPolysLayer); map.removeLayer(sombraRoadsLayer);
        }
      }catch(e){ console.error(e); }
    }
    document.getElementById('chk-sombra').addEventListener('change', e=>{
      if (e.target.checked){ sombraPolysLayer.addTo(map); sombraRoadsLayer.addTo(map); }
      else { map.removeLayer(sombraPolysLayer); map.removeLayer(sombraRoadsLayer); }
    });
  </script>

  <!-- RUTA + RUTA ALTERNATIVA + SIMULACIÓN AMENAZAS + EXPORT PROB -->
  <script>
    // Capas de rutas
    const routeLayer   = L.layerGroup().addTo(map);
    const routeMarkers = L.layerGroup().addTo(map);
    const routeAltLayer = L.layerGroup();  // ruta alternativa ejemplo (punto 8)

    let routingMode = false;
    let picks = [];

    const chkRoute   = document.getElementById('chk-route');
    const btnReset   = document.getElementById('btn-route-reset');
    const routeInfo  = document.getElementById('route-info');
    const chkRouteAlt = document.getElementById('chk-route-alt');

    // geojson de la última ruta base calculada (pgr_dijkstra)
    let lastRouteGeo = null;
    // geojson de las últimas amenazas simuladas (celdas rojas)
    let lastAmenazasFC = null;

    function resetRoute() {
      picks = [];
      routeLayer.clearLayers();
      routeMarkers.clearLayers();
      routeInfo.textContent = '';
      lastRouteGeo = null;
    }

    async function requestRoute() {
      if (picks.length !== 2) return;
      const src = `${picks[0].lat.toFixed(6)},${picks[0].lng.toFixed(6)}`;
      const dst = `${picks[1].lat.toFixed(6)},${picks[1].lng.toFixed(6)}`;
      routeInfo.textContent = 'Calculando ruta…';
      try {
        const r = await fetch(`http://localhost:8000/route?src=${src}&dst=${dst}`);
        if (!r.ok) throw new Error(`API ${r.status}`);
        const geo = await r.json();
        routeLayer.clearLayers();

        const geom = geo?.features?.[0]?.geometry || null;
        if (!geom) {
          routeInfo.textContent = 'Sin ruta posible entre los puntos (grafo desconectado).';
          lastRouteGeo = null;
          return;
        }

        const route = L.geoJSON(geo, {style:{color:'#ff00ff', weight:5}}); // fucsia continua
        routeLayer.addLayer(route);
        try { map.fitBounds(route.getBounds(), {padding:[20,20]}); } catch(_){}
        routeInfo.textContent = `Ruta lista ${src} → ${dst}`;
        lastRouteGeo = geo;  // guardamos para construir la alternativa
      } catch(e) {
        routeInfo.textContent = `Error: ${e.message}`;
        console.error(e);
        lastRouteGeo = null;
      }
    }

    function enableRouting() {
      routingMode = true;
      resetRoute();
      routeInfo.textContent = 'Haz 2 clics en el mapa (origen y destino).';
      map.getContainer().style.cursor = 'crosshair';
    }
    function disableRouting() {
      routingMode = false;
      map.getContainer().style.cursor = '';
      routeInfo.textContent = '';
    }

    map.on('click', (ev)=>{
      if (!routingMode) return;
      const {lat, lng} = ev.latlng;
      const n = picks.length + 1;
      const m = L.marker([lat,lng], {opacity:0.9})
                 .bindTooltip(n===1?'Origen':'Destino', {permanent:true, offset:[0,-16]});
      routeMarkers.addLayer(m);
      picks.push({lat,lng});
      if (picks.length === 2) requestRoute();
      else routeInfo.textContent = 'Selecciona destino…';
    });

    chkRoute.addEventListener('change', e=>{
      if (e.target.checked) enableRouting();
      else { disableRouting(); resetRoute(); }
    });
    btnReset.addEventListener('click', ()=>{
      resetRoute();
      if (routingMode) routeInfo.textContent = 'Haz 2 clics en el mapa (origen y destino).';
    });

    // Construcción de ruta alternativa usando amenazas simuladas
    function buildAltRouteFromThreats() {
      routeAltLayer.clearLayers();

      if (!lastRouteGeo || !lastRouteGeo.features || !lastRouteGeo.features.length) {
        routeInfo.textContent = 'Primero calcula una ruta base con pgr_dijkstra.';
        return;
      }
      if (!lastAmenazasFC || !lastAmenazasFC.features || !lastAmenazasFC.features.length) {
        routeInfo.textContent = 'Primero ejecuta la simulación de amenazas.';
        return;
      }

      const feat = lastRouteGeo.features[0];
      const geom = feat.geometry;
      if (!geom || geom.type !== 'LineString') {
        routeInfo.textContent = 'Formato de ruta no soportado para alternativa.';
        return;
      }

      const coords = geom.coordinates; // [ [lon,lat], ... ]
      const threatPolys = lastAmenazasFC.features;

      const altCoords = coords.map(([lon,lat]) => {
        const pt = turf.point([lon,lat]);
        let inside = false;
        for (let i=0;i<threatPolys.length;i++) {
          const poly = threatPolys[i];
          try {
            if (turf.booleanPointInPolygon(pt, poly)) {
              inside = true;
              break;
            }
          } catch(_) {}
        }
        if (inside) {
          // desplazamos el punto fuera de la celda roja (ejemplo simple NE)
          const shift = 0.0015; // ~150 m aprox
          return [lon + shift, lat + shift];
        }
        return [lon,lat];
      });

      const altGeo = {
        type: 'FeatureCollection',
        features: [{
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: altCoords },
          properties: {
            tipo: 'ruta_alternativa',
            descripcion: 'Ruta alternativa que rodea celdas con alta amenaza modelada.'
          }
        }]
      };

      const capa = L.geoJSON(altGeo, {
        style: {
          color: '#00ffff',      // celeste brillante
          weight: 6,
          dashArray: '10 6'      // bien discontinua
        }
      });

      routeAltLayer.addLayer(capa);
      routeAltLayer.addTo(map);
      try { map.fitBounds(routeAltLayer.getBounds(), { padding:[20,20] }); } catch(_){}

      routeInfo.textContent =
        'Ruta alternativa generada evitando, en lo posible, las celdas rojas de amenaza.';
    }

    chkRouteAlt.addEventListener('change', (e) => {
      if (e.target.checked) {
        buildAltRouteFromThreats();
      } else {
        map.removeLayer(routeAltLayer);
      }
    });

    // SIMULACIÓN DE AMENAZAS (puntos 6 y 7) usando UV + temperatura, sin archivos nuevos
    const amenazasSimLayer = L.layerGroup();
    const chkAmenazasSim   = document.getElementById('chk-amenazas-sim');
    const btnSimAmenazas   = document.getElementById('btn-simular-amenazas');
    const inputUmbral      = document.getElementById('umbral-falla');
    const amenazasInfo     = document.getElementById('amenazas-info');

    // función que modela probabilidad a partir de UV y temperatura
    function probDesdeUVTemp(uv, temp) {
      let pUV = 0, pT = 0;

      // UV: inspirado en rangos OMS (más peso)
      if (uv != null) {
        if (uv < 3)       pUV = 5;
        else if (uv < 6)  pUV = 25;
        else if (uv < 8)  pUV = 45;
        else if (uv < 11) pUV = 70;
        else              pUV = 90;
      }

      // Temperatura: umbral de confort vs estrés térmico
      if (temp != null) {
        if (temp < 20)       pT = 5;
        else if (temp < 25)  pT = 15;
        else if (temp < 30)  pT = 35;
        else if (temp < 35)  pT = 60;
        else                 pT = 80;
      }

      // combinación: 70% UV, 30% temperatura
      return Math.min(100, Math.round(pUV * 0.7 + pT * 0.3));
    }

    async function simularAmenazas() {
      // aseguramos que tenemos datos (si algo falló en la carga inicial)
      if (!uvData)  await loadUV();
      if (!tempData) await loadTemp();

      if (!uvData || !uvData.features || !uvData.features.length) {
        amenazasInfo.textContent = 'No hay datos de UV para simular amenazas.';
        lastAmenazasFC = { type:'FeatureCollection', features:[] };
        return;
      }

      const umbral = Number(inputUmbral.value) || 0;
      amenazasSimLayer.clearLayers();

      const posibles = [];
      const uvFeatures   = uvData.features || [];
      const tempFeatures = (tempData && tempData.features) ? tempData.features : [];

      const n = uvFeatures.length;

      for (let i = 0; i < n; i++) {
        const fUV   = uvFeatures[i];
        const fTemp = tempFeatures[i] || null;

        const uv   = fUV.properties ? fUV.properties.uv_index   : null;
        const temp = fTemp && fTemp.properties ? fTemp.properties.temp_c : null;

        const prob = probDesdeUVTemp(uv, temp);
        const rand = Math.random() * 100; // requisito del enunciado
        const ocurre = (rand <= prob) && (prob >= umbral);

        if (ocurre) {
          // Clonamos el feature para no tocar la capa original
          const feat = JSON.parse(JSON.stringify(fUV));
          feat.properties = {
            ...(feat.properties || {}),
            amenaza: 'Estrés térmico / radiación UV',
            prob_modelada: prob,
            detalle: `UV=${uv ?? 'n/a'} | Temp=${temp ?? 'n/a'}`
          };
          posibles.push(feat);
        }
      }

      if (!posibles.length) {
        amenazasInfo.textContent = 'Ninguna celda supera el umbral de falla con la simulación actual.';
        map.removeLayer(amenazasSimLayer);
        lastAmenazasFC = { type:'FeatureCollection', features:[] };
        return;
      }

      const fc = { type: 'FeatureCollection', features: posibles };
      lastAmenazasFC = fc; // guardamos para construir la ruta alternativa

      const capa = L.geoJSON(fc, {
        style: () => ({ color: '#ff0000', weight: 3 }),
        onEachFeature: (f, layer) => {
          const p = f.properties || {};
          const prob = p.prob_modelada ?? '?';
          layer.bindPopup(
            `<b>${p.amenaza || 'Amenaza'}</b><br>` +
            `Prob. falla modelada: ${prob}%<br>` +
            (p.detalle ? p.detalle : '')
          );
        }
      });

      amenazasSimLayer.addLayer(capa);

      if (chkAmenazasSim.checked) {
        amenazasSimLayer.addTo(map);
        try { map.fitBounds(amenazasSimLayer.getBounds(), { padding: [20, 20] }); } catch (_) {}
      } else {
        map.removeLayer(amenazasSimLayer);
      }

      amenazasInfo.textContent =
        `Amenazas que podrían ocurrir (simulación): ${posibles.length} (umbral ${umbral}%)`;
    }

    chkAmenazasSim.addEventListener('change', (e) => {
      if (e.target.checked) {
        amenazasSimLayer.addTo(map);
      } else {
        map.removeLayer(amenazasSimLayer);
      }
    });

    btnSimAmenazas.addEventListener('click', () => {
      simularAmenazas();
    });

    // ====== NUEVO: ARCHIVO CON PROB. DE FALLO POR ENLACE Y NODO (PUNTO 4) ======
    const btnExportProb = document.getElementById('btn-export-prob');

    // Busca el UV y Temp de la celda donde cae un punto
    function uvTempEnPunto(lon, lat) {
      const pt = turf.point([lon, lat]);
      let uv = null;
      let temp = null;

      if (uvData && uvData.features) {
        for (const f of uvData.features) {
          try {
            if (turf.booleanPointInPolygon(pt, f)) {
              uv = f.properties ? f.properties.uv_index : null;
              break;
            }
          } catch(_) {}
        }
      }
      if (tempData && tempData.features) {
        for (const f of tempData.features) {
          try {
            if (turf.booleanPointInPolygon(pt, f)) {
              temp = f.properties ? f.properties.temp_c : null;
              break;
            }
          } catch(_) {}
        }
      }
      return { uv, temp };
    }

    async function exportProbabilidadesEnlacesNodos() {
      // aseguramos que todo esté cargado
      if (!infraData) await loadInfra();
      if (!uvData)    await loadUV();
      if (!tempData)  await loadTemp();

      if (!infraData || !infraData.features || !infraData.features.length) {
        alert('No hay datos de infraestructura para generar el archivo.');
        return;
      }

      const linkFeatures = [];
      const nodeMap = {}; // key "lon,lat" -> coords

      // Enlaces: usamos el centro geométrico de cada segmento
      for (const f of infraData.features) {
        if (!f.geometry) continue;
        const geom = f.geometry;

        if (geom.type === 'LineString' || geom.type === 'MultiLineString') {
          const center = turf.centerOfMass(f);
          const [lon, lat] = center.geometry.coordinates;
          const { uv, temp } = uvTempEnPunto(lon, lat);
          const prob = probDesdeUVTemp(uv, temp);

          const linkFeat = {
            type: 'Feature',
            geometry: JSON.parse(JSON.stringify(geom)),
            properties: {
              ...(f.properties || {}),
              tipo_elemento: 'enlace',
              prob_falla: prob,
              uv,
              temp
            }
          };
          linkFeatures.push(linkFeat);

          // Noditos: extremos de cada LineString
          if (geom.type === 'LineString') {
            const coords = geom.coordinates;
            const extremos = [coords[0], coords[coords.length - 1]];
            extremos.forEach(([x,y])=>{
              const key = x.toFixed(6)+','+y.toFixed(6);
              if (!nodeMap[key]) nodeMap[key] = [x,y];
            });
          } else if (geom.type === 'MultiLineString') {
            geom.coordinates.forEach(ls=>{
              const extremos = [ls[0], ls[ls.length-1]];
              extremos.forEach(([x,y])=>{
                const key = x.toFixed(6)+','+y.toFixed(6);
                if (!nodeMap[key]) nodeMap[key] = [x,y];
              });
            });
          }
        }
      }

      // Nodos: cada punto extremo con su probabilidad
      const nodeFeatures = [];
      for (const key of Object.keys(nodeMap)) {
        const [lon, lat] = nodeMap[key];
        const { uv, temp } = uvTempEnPunto(lon, lat);
        const prob = probDesdeUVTemp(uv, temp);

        nodeFeatures.push({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [lon, lat] },
          properties: {
            tipo_elemento: 'nodo',
            prob_falla: prob,
            uv,
            temp
          }
        });
      }

      const fc = {
        type: 'FeatureCollection',
        features: linkFeatures.concat(nodeFeatures)
      };

      const blob = new Blob([JSON.stringify(fc)], { type: 'application/geo+json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'prob_falla_enlaces_nodos.geojson';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      amenazasInfo.textContent =
        `Archivo generado: ${linkFeatures.length} enlaces y ${nodeFeatures.length} nodos con prob. de falla.`;
    }

    btnExportProb.addEventListener('click', () => {
      exportProbabilidadesEnlacesNodos();
    });

    // CARGAS INICIALES
    (async()=>{
      await loadInfra();
      await loadBeb();
      await loadTemp();
      await loadUV();
      await loadSombraStatic();
    })();
  </script>
</body>
